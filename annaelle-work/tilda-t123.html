      font-size: 18px;
      line-height: 1;
    }

    #annaelle-career-cta.is-hidden {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 10px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #annaelle-career-cta {
      transition: none;
    }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("annaelle-career-t123");
    const frame = document.getElementById("annaelle-career-frame");
    const cta = document.getElementById("annaelle-career-cta");

    if (!root || !frame || !cta || root.dataset.ready === "true") return;
    root.dataset.ready = "true";

    const allowedOrigin = "https://efilym89.github.io";
    let applicationTop = 0;
    let applicationHeight = 0;
    let updateFrame = 0;
    let leadTracked = false;

    const frameTop = () => window.scrollY + frame.getBoundingClientRect().top;

    const scrollToFrameOffset = (offset) => {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({
        top: Math.max(0, frameTop() + Math.max(0, Number(offset) || 0) - 24),
        behavior: reducedMotion ? "auto" : "smooth"
      });
    };

    const updateCta = () => {
      updateFrame = 0;
      if (!applicationTop || window.innerWidth > 680) {
        cta.classList.remove("is-hidden");
        return;
      }

      const viewportTop = window.scrollY;
      const viewportBottom = viewportTop + window.innerHeight;
      const formTop = frameTop() + applicationTop;
      const formBottom = formTop + applicationHeight;
      const formIsVisible = formBottom > viewportTop + 80 && formTop < viewportBottom - 90;
      cta.classList.toggle("is-hidden", formIsVisible);
    };

    const scheduleCtaUpdate = () => {
      if (updateFrame) return;
      updateFrame = window.requestAnimationFrame(updateCta);
    };

    window.addEventListener("message", (event) => {
      if (event.origin !== allowedOrigin || event.source !== frame.contentWindow) return;
      if (!event.data) return;

      if (event.data.type === "annaelle-career-lead") {
        if (!leadTracked && typeof window.fbq === "function") {
          leadTracked = true;
          window.fbq("track", "Lead", {
            content_name: "Annaelle Vacancy Application",
            content_category: "Recruitment"
          });
        }
        return;
      }

      if (event.data.type === "annaelle-career-scroll") {
        scrollToFrameOffset(event.data.targetTop);
        return;
      }

      if (event.data.type !== "annaelle-career-layout") return;

      const height = Math.min(30000, Math.max(900, Math.ceil(Number(event.data.height) || 0)));
      applicationTop = Math.max(0, Number(event.data.applicationTop) || 0);
      applicationHeight = Math.max(0, Number(event.data.applicationHeight) || 0);
      frame.style.height = `${height}px`;
      scheduleCtaUpdate();
    });

    cta.addEventListener("click", () => {
      if (!applicationTop) return;
      scrollToFrameOffset(applicationTop);
    });

    window.addEventListener("scroll", scheduleCtaUpdate, { passive: true });
    window.addEventListener("resize", scheduleCtaUpdate);
    frame.addEventListener("load", scheduleCtaUpdate);
  })();
</script>
