<!-- Annaelle ROP vacancy: paste this block into a separate Tilda page. -->
<div id="annaelle-rop-t123">
  <iframe
    id="annaelle-rop-frame"
    src="https://efilym89.github.io/MGLending/annaelle-rop/?embed=1&amp;v=20261009-1"
    title="Вакансия руководителя отдела продаж в Annaelle"
    loading="eager"
    scrolling="no"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <button id="annaelle-rop-cta" type="button" aria-label="Перейти к отклику на вакансию РОПа">
    <span aria-hidden="true">✦</span><span>Откликнуться на вакансию</span>
  </button>
</div>

<style>
  #annaelle-rop-t123 { position:relative;width:100%;margin:0;background:#fef7fb; }
  #annaelle-rop-frame { display:block;width:100%;height:1200px;margin:0;border:0;background:#fef7fb; }
  #annaelle-rop-cta { display:none; }
  @media(max-width:680px) {
    #annaelle-rop-cta {
      position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:999999;
      display:flex;align-items:center;justify-content:center;gap:8px;
      width:min(340px,calc(100% - 36px));min-height:51px;padding:10px 18px;box-sizing:border-box;
      color:#fff;background:linear-gradient(180deg,#c58c98,#b77a88);border:0;
      border-radius:20px 8px 24px 8px;box-shadow:0 10px 24px #633e4842;
      font:600 12px/1.2 Inter,Arial,sans-serif;white-space:nowrap;cursor:pointer;transform:translateX(-50%);
    }
    #annaelle-rop-cta>span:first-child { font-size:18px;line-height:1; }
    #annaelle-rop-cta.is-hidden { visibility:hidden;pointer-events:none; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById('annaelle-rop-t123');
    const frame = document.getElementById('annaelle-rop-frame');
    const cta = document.getElementById('annaelle-rop-cta');
    if (!root || !frame || !cta || root.dataset.ready === 'true') return;
    root.dataset.ready = 'true';

    const frameUrl = new URL(frame.src);
    const allowedOrigin = frameUrl.origin;
    const params = new URLSearchParams(window.location.search);
    ['utm_source','utm_campaign','utm_content'].forEach(key => {
      if (params.has(key)) frameUrl.searchParams.set(key, params.get(key));
    });
    if (frame.src !== frameUrl.href) frame.src = frameUrl.href;

    let layout = null;
    let updateFrame = 0;
    const frameTop = () => window.scrollY + frame.getBoundingClientRect().top;
    const scrollToOffset = offset => {
      const value = Number(offset);
      if (!Number.isFinite(value)) return;
      window.scrollTo({
        top:Math.max(0,frameTop() + Math.max(0,value) - 24),
        behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'
      });
    };
    const intersectsViewport = (offset,height) => {
      const top = frameTop() + offset;
      return top + height > window.scrollY + 80 && top < window.scrollY + window.innerHeight - 20;
    };
    const updateCta = () => {
      updateFrame = 0;
      const hidden = !layout || window.innerWidth > 680 ||
        intersectsViewport(layout.applicationTop,layout.applicationHeight) ||
        intersectsViewport(layout.heroActionsTop,layout.heroActionsHeight);
      cta.classList.toggle('is-hidden',hidden);
    };
    const scheduleCta = () => {
      if (!updateFrame) updateFrame = window.requestAnimationFrame(updateCta);
    };
    window.addEventListener('message',event => {
      if (event.origin !== allowedOrigin || event.source !== frame.contentWindow || !event.data) return;
      if (event.data.type === 'annaelle-rop-scroll') {
        scrollToOffset(event.data.targetTop);
        return;
      }
      if (event.data.type !== 'annaelle-rop-layout') return;
      const keys = ['height','applicationTop','applicationHeight','heroActionsTop','heroActionsHeight'];
      if (keys.some(key => !Number.isFinite(event.data[key]) || event.data[key] < 0)) return;
      layout = event.data;
      frame.style.height = `${Math.min(30000,Math.max(900,Math.ceil(layout.height)))}px`;
      scheduleCta();
    });
    cta.addEventListener('click',() => {
      if (layout) scrollToOffset(layout.applicationTop);
    });
    window.addEventListener('scroll',scheduleCta,{passive:true});
    window.addEventListener('resize',scheduleCta);
    frame.addEventListener('load',scheduleCta);
    updateCta();
  })();
</script>
